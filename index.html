<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f0eb" />
    <meta
      name="description"
      content="Aussa.co ödemeniz için IBAN ve hesap bilgileri. Tek dokunuşla kopyalayın."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:title" content="Ödeme Bilgileri — Aussa.co" />
    <meta
      property="og:description"
      content="Aussa.co ödemeniz için IBAN ve hesap bilgileri."
    />
    <meta property="og:type" content="website" />
    <title>Ödeme Bilgileri — Aussa.co</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f2f0eb;
        --foreground: #30251f;
        --card: #fbfbf9;
        --muted: #7c858c;
        --border: #deddd7;
        --ink: #2b201b;
        --success: #435f4d;
        --danger: #9e433d;
        --shadow-card: 0 1px 2px rgb(48 37 31 / 4%), 0 8px 24px -12px rgb(48 37 31 / 10%);
        --shadow-button: 0 6px 16px -8px rgb(43 32 27 / 45%);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: "Karla", "Avenir Next", Avenir, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(100%, 560px);
        margin-inline: auto;
        padding: 64px 22px 48px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .brand-mark {
        display: grid;
        width: 60px;
        height: 60px;
        flex: 0 0 60px;
        place-items: center;
        border-radius: 14px;
        background: var(--ink);
        color: #f6f1e9;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 28px;
        line-height: 1;
        box-shadow: var(--shadow-card);
      }

      .brand-name {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 34px;
        font-weight: 400;
        font-style: italic;
        line-height: 1;
      }

      .intro {
        margin-top: 54px;
      }

      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 31px;
        font-weight: 400;
        line-height: 1.2;
      }

      .intro-copy {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
        letter-spacing: 0.025em;
      }

      .payment-card {
        margin-top: 40px;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--card);
        box-shadow: var(--shadow-card);
      }

      .card-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .eyebrow,
      .country {
        margin: 0;
        font-size: 11px;
        line-height: 1.4;
      }

      .eyebrow {
        font-weight: 600;
        letter-spacing: 0.25em;
      }

      .country {
        color: var(--muted);
      }

      .card-subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .divider {
        height: 1px;
        margin: 24px 0;
        border: 0;
        background: var(--border);
      }

      .iban {
        margin: 0;
        overflow: hidden;
        font-family: "Karla", "Avenir Next", Avenir, system-ui, sans-serif;
        font-size: clamp(15px, 4.35vw, 23px);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        letter-spacing: 0.075em;
        line-height: 1.55;
        white-space: nowrap;
      }

      .details {
        display: grid;
        gap: 20px;
      }

      .detail-label {
        margin: 0;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .detail-value {
        margin: 7px 0 0;
        font-size: 16px;
      }

      .copy-button {
        display: flex;
        width: 100%;
        min-height: 70px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 32px;
        padding: 16px;
        border: 0;
        border-radius: 15px;
        background: var(--ink);
        color: #fffdf9;
        box-shadow: var(--shadow-button);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .copy-button:hover {
        opacity: 0.91;
      }

      .copy-button:active {
        transform: translateY(1px);
      }

      .copy-button:focus-visible,
      .instagram-link:focus-visible {
        outline: 2px solid var(--muted);
        outline-offset: 4px;
      }

      .copy-icon {
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
      }

      .copy-status {
        min-height: 20px;
        margin: 12px 0 -12px;
        color: var(--success);
        font-size: 13px;
        text-align: center;
      }

      .copy-status[data-state="error"] {
        color: var(--danger);
      }

      .footer {
        margin-top: 40px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }

      .footer-note {
        margin: 0;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }

      .instagram-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 24px;
        color: var(--foreground);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .instagram-link:hover {
        opacity: 0.7;
      }

      .instagram-icon {
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
      }

      @media (max-width: 420px) {
        .page {
          padding-top: 44px;
        }

        .payment-card {
          padding: 25px 20px;
        }

        .iban {
          font-size: clamp(14px, 4.25vw, 18px);
          letter-spacing: 0.06em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="brand" aria-label="Aussa.co">
        <span class="brand-mark" aria-hidden="true">a.</span>
        <p class="brand-name">Aussa.co</p>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Ödeme Bilgileri</h1>
        <p class="intro-copy">
          Ödemeniz için gerekli hesap bilgileri aşağıdadır.<br />
          IBAN'ı tek dokunuşla kopyalayabilirsiniz.
        </p>
      </section>

      <section class="payment-card" aria-label="Banka hesap bilgileri">
        <div class="card-heading">
          <p class="eyebrow">IBAN</p>
          <p class="country">TR / TRY</p>
        </div>
        <p class="card-subtitle">Banka hesap bilgileri</p>

        <hr class="divider" />

        <p class="iban" id="iban">TR83 0006 7010 0000 0043 2752 51</p>

        <hr class="divider" />

        <div class="details">
          <div>
            <p class="detail-label">Hesap Sahibi</p>
            <p class="detail-value">Sevgi Karaaslan</p>
          </div>
          <div>
            <p class="detail-label">Banka</p>
            <p class="detail-value">Yapı Kredi</p>
          </div>
        </div>

        <button class="copy-button" id="copy-button" type="button" aria-label="IBAN'ı panoya kopyala">
          <svg class="copy-icon" id="copy-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="8" y="8" width="12" height="13" rx="2" stroke="currentColor" stroke-width="1.7" />
            <path d="M16 5V4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h1" stroke="currentColor" stroke-width="1.7" />
          </svg>
          <span id="button-label">IBAN'ı Kopyala</span>
        </button>
        <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
      </section>

      <footer class="footer">
        <p class="footer-note">Özel ve Güvenli Ödeme</p>
        <a
          class="instagram-link"
          href="https://www.instagram.com/aussaaus?stkn=b2VjN3p2dHFkemQ1"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg class="instagram-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.7" />
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7" />
            <circle cx="17.5" cy="6.8" r="1" fill="currentColor" />
          </svg>
          <span>Instagram'a Git</span>
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 12 12 4M5 4h7v7" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </a>
      </footer>
    </main>

    <script>
      const copyButton = document.getElementById("copy-button");
      const buttonLabel = document.getElementById("button-label");
      const copyStatus = document.getElementById("copy-status");
      const iban = document.getElementById("iban").textContent.replace(/\s+/g, "");
      let resetTimer;

      async function copyIban() {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(iban);
          } else {
            const input = document.createElement("textarea");
            input.value = iban;
            input.setAttribute("readonly", "");
            input.style.position = "fixed";
            input.style.opacity = "0";
            document.body.appendChild(input);
            input.select();
            const copied = document.execCommand("copy");
            input.remove();
            if (!copied) throw new Error("copy-failed");
          }

          buttonLabel.textContent = "Kopyalandı ✓";
          copyStatus.dataset.state = "success";
          copyStatus.textContent = "IBAN panoya kopyalandı.";
        } catch {
          buttonLabel.textContent = "Tekrar Dene";
          copyStatus.dataset.state = "error";
          copyStatus.textContent = "Kopyalanamadı. IBAN'ı seçip elle kopyalayabilirsiniz.";
        }

        window.clearTimeout(resetTimer);
        resetTimer = window.setTimeout(() => {
          buttonLabel.textContent = "IBAN'ı Kopyala";
          copyStatus.textContent = "";
          delete copyStatus.dataset.state;
        }, 2200);
      }

      copyButton.addEventListener("click", copyIban);
    </script>
  </body>
</html>
